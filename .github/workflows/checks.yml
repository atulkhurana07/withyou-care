name: Project checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:repository
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          FIREBASE_MODE: emulator
          APP_ENV: development
          DEVELOPMENT_CHECKOUT: "true"
          EMAIL_MODE: local
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/patient-mobile
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter test --dart-define=ALLOW_LOCAL_DEMO_HTTP=true
      - run: flutter build web --base-href /care-app/
